name: Bootstrap project import

on:
  push:
    branches:
      - agent/import-processor-and-real-validation
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-import.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-processor-and-real-validation
          fetch-depth: 0

      - name: Reconstruct project tree
        shell: bash
        run: |
          set -euxo pipefail
          cat \
            .bootstrap/project.tar.xz.b64.part00 \
            .bootstrap/fixed01/chunk-* \
            .bootstrap/project.tar.xz.b64.part02 \
            .bootstrap/project.tar.xz.b64.part03 \
            .bootstrap/project.tar.xz.b64.part04 \
            > /tmp/project.tar.xz.b64
          echo 'bc72b4fd860c5921ad20a419bb02c457c1d5184c3ef18332c66bb4d4a239a9b1  /tmp/project.tar.xz.b64' | sha256sum -c -
          base64 --decode /tmp/project.tar.xz.b64 > /tmp/project.tar.xz
          xz --test /tmp/project.tar.xz
          tar -xJf /tmp/project.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml

      - name: Commit imported project
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import annotation processor project"
          git push origin HEAD:agent/import-processor-and-real-validation
